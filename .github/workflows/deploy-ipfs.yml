name: Deploy Portfolio to IPFS (Fixed ZIP Method)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create ZIP of website
        run: |
          # Excluimos la carpeta .git y el propio zip si existiera
          zip -r portfolio.zip . -x "*.git*" "*.github*" "portfolio.zip"
          echo "✅ Archivo portfolio.zip creado."

      - name: Upload to Pinata
        id: upload
        run: |
          echo "🔄 Subiendo a Pinata..."
          RESPONSE=$(curl -s -X POST \
            -F "file=@portfolio.zip" \
            -H "Authorization: Bearer ${{ secrets.PINATA_JWT }}" \
            "https://api.pinata.cloud/pinning/pinFileToIPFS")
          
          echo "Respuesta de Pinata: $RESPONSE"
          
          CID=$(echo $RESPONSE | jq -r '.IpfsHash')
          
          if [ "$CID" = "null" ] || [ -z "$CID" ]; then
            echo "❌ ERROR: No se pudo obtener el CID. Revisa tu JWT o permisos en Pinata."
            exit 1
          fi
          
          echo "✅ ¡Éxito! CID: $CID"
          echo "CID=$CID" >> $GITHUB_OUTPUT

      - name: Mostrar Resultado
        run: |
          echo "🚀 TU WEB ESTÁ ONLINE EN:"
          echo "https://gateway.mypinata.cloud/ipfs/${{ steps.upload.outputs.CID }}"

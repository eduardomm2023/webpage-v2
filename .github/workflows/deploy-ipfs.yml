name: Deploy Portfolio to IPFS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Pinata via IPFS Action
        uses: aquiladev/ipfs-action@v0.2.4
        with:
          host: https://api.pinata.cloud
          path: './' # Ajusta si tu web está en /docs o /public
          pinata-key: ${{ secrets.PINATA_API_KEY }}
          pinata-secret: ${{ secrets.PINATA_SECRET_API_KEY }}
          pinata-name: 'Portfolio Eduardo MM'
          verbose: true   
